server {
    listen 80;
    server_name ims.vishwajit.tech;

    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl http2;

    server_name ims.vishwajit.tech;

    ssl_certificate /etc/letsencrypt/live/ims.vishwajit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ims.vishwajit.tech/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
    }
}
